name: llm-movie-advisor

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-False}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
      DJANGO_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_HSTS_INCLUDE_SUBDOMAINS:-False}
      DJANGO_HSTS_PRELOAD: ${DJANGO_HSTS_PRELOAD:-False}
      DJANGO_TRUST_X_FORWARDED_PROTO: ${DJANGO_TRUST_X_FORWARDED_PROTO:-False}
      DJANGO_MAX_REQUEST_BYTES: ${DJANGO_MAX_REQUEST_BYTES:-2097152}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      DJANGO_REQUEST_LOG_LEVEL: ${DJANGO_REQUEST_LOG_LEVEL:-WARNING}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
      REDIS_URL: redis://redis:6379/1
      REDIS_LOCK_TIMEOUT: ${REDIS_LOCK_TIMEOUT:-120}
      REDIS_LOCK_BLOCKING_TIMEOUT: ${REDIS_LOCK_BLOCKING_TIMEOUT:-5}
      TMDB_CATALOG_LOCK_TIMEOUT: ${TMDB_CATALOG_LOCK_TIMEOUT:-1800}
      CATALOG_SEARCH_CACHE_TIMEOUT: ${CATALOG_SEARCH_CACHE_TIMEOUT:-600}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
      OLLAMA_EMBEDDING_DIMENSIONS: ${OLLAMA_EMBEDDING_DIMENSIONS:-768}
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-120}
      OLLAMA_HEALTH_TIMEOUT_SECONDS: ${OLLAMA_HEALTH_TIMEOUT_SECONDS:-2}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.4}
      OLLAMA_TOP_P: ${OLLAMA_TOP_P:-}
      OLLAMA_TOP_K: ${OLLAMA_TOP_K:-}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-}
      OLLAMA_REPEAT_PENALTY: ${OLLAMA_REPEAT_PENALTY:-}
      LLM_CATALOG_CONTEXT_CACHE_TIMEOUT: ${LLM_CATALOG_CONTEXT_CACHE_TIMEOUT:-300}
      LLM_CATALOG_CANDIDATE_LIMIT: ${LLM_CATALOG_CANDIDATE_LIMIT:-12}
      LLM_CATALOG_OVERVIEW_MAX_LENGTH: ${LLM_CATALOG_OVERVIEW_MAX_LENGTH:-600}
      LLM_CATALOG_SEARCH_TERM_LIMIT: ${LLM_CATALOG_SEARCH_TERM_LIMIT:-10}
      LLM_USER_PREFERENCE_LIMIT: ${LLM_USER_PREFERENCE_LIMIT:-20}
      LLM_USER_INTERACTION_LIMIT: ${LLM_USER_INTERACTION_LIMIT:-20}
      LLM_PROFILE_SUMMARY_MAX_LENGTH: ${LLM_PROFILE_SUMMARY_MAX_LENGTH:-1500}
      LLM_PREFERENCE_VALUE_MAX_LENGTH: ${LLM_PREFERENCE_VALUE_MAX_LENGTH:-300}
      LLM_EMBEDDING_MODEL_VERSION: ${LLM_EMBEDDING_MODEL_VERSION:-v1}
      LLM_EMBEDDING_SOURCE_LANGUAGE: ${LLM_EMBEDDING_SOURCE_LANGUAGE:-pl-PL}
      LLM_EMBEDDING_BATCH_SIZE: ${LLM_EMBEDDING_BATCH_SIZE:-32}
      LLM_EMBEDDING_SYNC_LOCK_TIMEOUT: ${LLM_EMBEDDING_SYNC_LOCK_TIMEOUT:-3600}
      LLM_SEMANTIC_SEARCH_ENABLED: ${LLM_SEMANTIC_SEARCH_ENABLED:-True}
      LLM_SEMANTIC_MIN_SIMILARITY: ${LLM_SEMANTIC_MIN_SIMILARITY:-0.2}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
    command:
      - /bin/sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        exec gunicorn backend.wsgi:application
        --bind 0.0.0.0:8000
        --workers ${GUNICORN_WORKERS:-3}
        --timeout ${GUNICORN_TIMEOUT:-180}
        --access-logfile -
        --error-logfile -
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.32.3-rocm}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.32.3-rocm}
    environment:
      OLLAMA_HOST: http://ollama:11434
    command:
      - pull
      - ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  ollama-embed-init:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.32.3-rocm}
    environment:
      OLLAMA_HOST: http://ollama:11434
    command:
      - pull
      - ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  catalog-sync:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "False"
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
      REDIS_URL: redis://redis:6379/1
      REDIS_LOCK_TIMEOUT: ${REDIS_LOCK_TIMEOUT:-120}
      REDIS_LOCK_BLOCKING_TIMEOUT: ${REDIS_LOCK_BLOCKING_TIMEOUT:-5}
      TMDB_CATALOG_LOCK_TIMEOUT: ${TMDB_CATALOG_LOCK_TIMEOUT:-1800}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
      OLLAMA_EMBEDDING_DIMENSIONS: ${OLLAMA_EMBEDDING_DIMENSIONS:-768}
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-120}
      OLLAMA_HEALTH_TIMEOUT_SECONDS: ${OLLAMA_HEALTH_TIMEOUT_SECONDS:-2}
      LLM_EMBEDDING_MODEL_VERSION: ${LLM_EMBEDDING_MODEL_VERSION:-v1}
      LLM_EMBEDDING_SOURCE_LANGUAGE: ${LLM_EMBEDDING_SOURCE_LANGUAGE:-pl-PL}
      LLM_EMBEDDING_BATCH_SIZE: ${LLM_EMBEDDING_BATCH_SIZE:-32}
      LLM_EMBEDDING_SYNC_LOCK_TIMEOUT: ${LLM_EMBEDDING_SYNC_LOCK_TIMEOUT:-3600}
      TMDB_BASELINE_MOVIES: ${TMDB_BASELINE_MOVIES:-2000}
      TMDB_BASELINE_TV_SHOWS: ${TMDB_BASELINE_TV_SHOWS:-2000}
      TMDB_SYNC_INTERVAL_SECONDS: ${TMDB_SYNC_INTERVAL_SECONDS:-21600}
      TMDB_SYNC_DAYS_BACK: ${TMDB_SYNC_DAYS_BACK:-30}
      TMDB_SYNC_MAX_PAGES: ${TMDB_SYNC_MAX_PAGES:-10}
      TMDB_UPCOMING_DAYS_AHEAD: ${TMDB_UPCOMING_DAYS_AHEAD:-365}
      TMDB_UPCOMING_MAX_PAGES: ${TMDB_UPCOMING_MAX_PAGES:-10}
    command:
      - /bin/sh
      - -c
      - >-
        while true; do
          python manage.py sync_tmdb_catalog;
          python manage.py sync_content_embeddings;
          sleep "$${TMDB_SYNC_INTERVAL_SECONDS}";
        done
    depends_on:
      app:
        condition: service_healthy
      ollama-embed-init:
        condition: service_completed_successfully
    restart: unless-stopped

  demo-seed:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "True"
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?Set SEED_USER_PASSWORD in .env}
    command:
      - /bin/sh
      - -c
      - >-
        until python manage.py shell -c
        "from backend.api.models import Content; raise SystemExit(0 if Content.objects.count() >= 3 else 1)";
        do
          echo "Waiting for at least 3 catalog items before seeding demo data...";
          sleep 5;
        done;
        exec python manage.py seed_demo_data
    depends_on:
      app:
        condition: service_healthy
      catalog-sync:
        condition: service_started
    restart: "no"

  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/postgresql_recommendation_platform_schema.sql:/docker-entrypoint-initdb.d/10-business-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:8.2.8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:
